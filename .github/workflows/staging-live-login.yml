name: Staging live login

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-live-login
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/rehearsal/staging-session-continuity'
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install Chromium smoke tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/staging-smoke" --no-save --no-audit --no-fund playwright@1.65.1
          "$RUNNER_TEMP/staging-smoke/node_modules/.bin/playwright" install --with-deps chromium
      - name: Establish the staging session
        env:
          STAGING_SMOKE_USERNAME: ${{ secrets.STAGING_SMOKE_USERNAME }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
        run: |
          marker="$RUNNER_TEMP/rehearsal"
          (
            set +e
            REHEARSAL_MARKER="$marker" NODE_PATH="$RUNNER_TEMP/staging-smoke/node_modules" node scripts/staging-live-login.mjs >"$marker.log" 2>&1
            echo "$?" >"$marker.exit"
          ) </dev/null >/dev/null 2>&1 &
          while [[ ! -e "$marker.baseline" && ! -e "$marker.exit" ]]; do sleep 1; done
          cat "$marker.log"
          test -s "$marker.baseline"
      - name: Observe the rolled-back build
        run: |
          marker="$RUNNER_TEMP/rehearsal"
          while [[ ! -e "$marker.rollback" && ! -e "$marker.exit" ]]; do sleep 1; done
          cat "$marker.log"
          test -s "$marker.rollback"
      - name: Observe the restored build
        run: |
          marker="$RUNNER_TEMP/rehearsal"
          while [[ ! -e "$marker.exit" ]]; do sleep 1; done
          cat "$marker.log"
          test -s "$marker.restore"
          test "$(cat "$marker.exit")" = 0
