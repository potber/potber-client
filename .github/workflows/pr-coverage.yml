name: PR browser coverage

on:
  workflow_call:

permissions:
  contents: read

jobs:
  measure:
    name: Measure coverage (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Base
            ref: ${{ github.event.pull_request.base.sha }}
            artifact: coverage-base
            path: coverage/coverage-summary.json
          - label: Pull request
            ref: ${{ github.sha }}
            artifact: coverage-report
            path: coverage/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: env -u GITHUB_STEP_SUMMARY npm run test:coverage
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: measure
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v7
        with:
          name: coverage-base
          path: ${{ runner.temp }}/coverage-base
      - uses: actions/download-artifact@v7
        with:
          name: coverage-report
          path: coverage/
      - name: Compare coverage against the exact base
        run: |
          node scripts/check-coverage.mjs
          cat "$GITHUB_STEP_SUMMARY"
        env:
          COVERAGE_BASELINE: ${{ runner.temp }}/coverage-base/coverage-summary.json
