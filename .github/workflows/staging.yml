name: staging

on:
  workflow_dispatch:
  push:
    branches:
    - main

permissions:
  contents: read

jobs:
  lint:
    uses: potber/.github/.github/workflows/npm_lint.yml@v2

  test:
    uses: potber/.github/.github/workflows/npm_test-coverage.yml@v2

  deploy_static:
    needs:
    - lint
    - test
    uses: ./.github/workflows/deploy_static.yml
    with:
      environment: test
    secrets: inherit
