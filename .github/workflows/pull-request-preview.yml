name: pull-request-preview

# Deploys each same-repository PR to https://pr-<number>.preview.potber.de.
# The build is uploaded to the folder pr-<number>/ of the preview Storage Zone;
# the Edge Script in deploy/preview-edge-script.ts maps the hostname to it.
# Settings come from the GitHub Environment `preview` (see README).

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.preview.potber.de

jobs:
  # Dependabot and fork PRs get no secrets; they run lint/tests only.
  deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/deploy_static.yml
    with:
      environment: preview
      storage_prefix: pr-${{ github.event.pull_request.number }}
      appsignal_revision: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
    secrets: inherit

  comment:
    if: needs.deploy.outputs.deployed == 'true'
    needs:
      - deploy
    runs-on: ubuntu-latest
    steps:
      - name: Comment preview URL
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- bunny-preview -->';
            const body = `${marker}\nPreview deployed: ${process.env.PREVIEW_URL}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (comment) =>
                comment.body?.includes(marker) ||
                comment.body?.includes('<!-- flux-preview -->'),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Delete preview folder
        if: vars.BUNNY_STORAGE_ZONE != ''
        shell: bash
        run: |
          # A path ending in / deletes the folder and everything in it.
          status="$(curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' \
            --request DELETE \
            --header "AccessKey: ${BUNNY_STORAGE_PASSWORD}" \
            "https://${BUNNY_STORAGE_HOSTNAME:-storage.bunnycdn.com}/${BUNNY_STORAGE_ZONE}/${PREFIX}/")"
          case "$status" in
            2??) echo "Deleted ${PREFIX}/" ;;
            404) echo "Nothing to delete for ${PREFIX}/" ;;
            *) echo "Deleting ${PREFIX}/ failed with HTTP ${status}" >&2; exit 1 ;;
          esac
        env:
          PREFIX: pr-${{ github.event.pull_request.number }}
          BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_HOSTNAME: ${{ vars.BUNNY_STORAGE_HOSTNAME }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}

      - name: Purge Pull Zone cache
        if: vars.BUNNY_STORAGE_ZONE != ''
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --retry 3 \
            --request POST \
            --header "AccessKey: ${BUNNYNET_API_KEY}" \
            "https://api.bunny.net/pullzone/${BUNNY_PULL_ZONE_ID}/purgeCache"
        env:
          BUNNY_PULL_ZONE_ID: ${{ vars.BUNNY_PULL_ZONE_ID }}
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}

      - name: Mark preview comment as removed
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- bunny-preview -->';
            const body = `${marker}\nPreview removed: ${process.env.PREVIEW_URL}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (comment) =>
                comment.body?.includes(marker) ||
                comment.body?.includes('<!-- flux-preview -->'),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            }
